<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="mt-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#mt-bg)" />
  <g filter="url(#shadow)">
    <!-- Plate base -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="100 14" opacity="0.9" />
    <!-- Fork & Knife minimalist stylization -->
    <path d="M25 21v8m0 0a3 3 0 0 0 6 0V21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 29v14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Pulse checkmark / track accent -->
    <path d="M35 34l3 3 7-8" fill="none" stroke="url(#mt-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
